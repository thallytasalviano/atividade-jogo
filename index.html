<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miraculous - Personagens</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🐞 Miraculous</h1>
        <p>Cadastro de Personagens</p>
    </header>

    <main class="container">

        <!-- FORMULÁRIO -->
        <section class="formulario">

            <h2 id="tituloFormulario">
                👤 Cadastrar Personagem
            </h2>

            <form id="formPersonagem">

                <div class="campo">
                    <label for="nome">Nome do personagem</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Ladybug"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        placeholder="Ex: 15"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="identidade">Identidade</label>
                    <input
                        type="text"
                        id="identidade"
                        placeholder="Ex: Marinette Dupain-Cheng"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="miraculous">Miraculous</label>

                    <select id="miraculous" required>
                        <option value="">Selecione</option>
                        <option value="Joaninha">Joaninha</option>
                        <option value="Gato">Gato</option>
                        <option value="Raposa">Raposa</option>
                        <option value="Tartaruga">Tartaruga</option>
                        <option value="Abelha">Abelha</option>
                        <option value="Borboleta">Borboleta</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="poder">Poder</label>
                    <input
                        type="text"
                        id="poder"
                        placeholder="Ex: Criar objetos"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="Herói">Herói</option>
                        <option value="Heroína">Heroína</option>
                        <option value="Vilão">Vilão</option>
                        <option value="Aliado">Aliado</option>
                    </select>
                </div>

                <button type="submit" id="btnSalvar">
                    🐞 Cadastrar Personagem
                </button>

                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-cancelar"
                    style="display: none;"
                >
                    Cancelar
                </button>

            </form>

        </section>


        <!-- LISTA DOS PERSONAGENS -->
        <section class="personagens">

            <div class="titulo-lista">

                <h2>👥 Personagens Cadastrados</h2>

                <span id="contador">
                    Total: 0
                </span>

            </div>

            <div
                id="listaPersonagens"
                class="lista-personagens"
            >
            </div>

        </section>

    </main>


    <footer>
        <p>🐞 Miraculous - CRUD de Personagens</p>
    </footer>


    <script src="js/script.js"></script>

</

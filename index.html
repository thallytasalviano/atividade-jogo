<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Pessoas</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <header>
      <h1>👤 Cadastro de Pessoas</h1>

      <p>CRUD - Cadastro de Pessoas</p>
    </header>

    <main class="container">

      <!-- ============================= -->
      <!-- Formulário                    -->
      <!-- ============================= -->

      <section class="formulario">

        <h2 id="tituloFormulario">
          Nova Pessoa
        </h2>

        <form id="formPessoa">

          <div class="campo">
            <label for="nome">Nome</label>

            <input
              type="text"
              id="nome"
              placeholder="Digite o nome completo"
              required
            />
          </div>

          <div class="campo">
            <label for="idade">Idade</label>

            <input
              type="number"
              id="idade"
              min="0"
              max="120"
              placeholder="Digite a idade"
              required
            />
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>

            <input
              type="text"
              id="cpf"
              placeholder="000.000.000-00"
              required
            />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>

            <input
              type="tel"
              id="telefone"
              placeholder="(84) 99999-9999"
              required
            />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              placeholder="exemplo@email.com"
              required
            />
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>

            <input
              type="text"
              id="cidade"
              placeholder="Digite a cidade"
              required
            />
          </div>

          <button type="submit" id="btnCadastrar">
            Cadastrar Pessoa
          </button>

          <button
            type="button"
            id="btnCancelar"
            class="btn-cancelar"
            hidden
          >
            Cancelar Edição
          </button>

        </form>

      </section>


      <!-- ============================= -->
      <!-- Painel                        -->
      <!-- ============================= -->

      <section class="painel">

        <div class="topo-lista">

          <h2>Pessoas Cadastradas</h2>

          <span id="contador">
            Total: 0
          </span>

        </div>

        <div
          id="listaPessoas"
          class="lista-pessoas"
        ></div>

      </section>

    </main>

    <script src="js/script.js"></script>

  </body>
    </html>

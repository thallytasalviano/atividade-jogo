<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Princesas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Princesas</h1>

        <form id="formPrincesa">

            <input type="text" id="nome" placeholder="Nome da princesa" required>

            <input type="text" id="reino" placeholder="Reino" required>

            <input type="number" id="idade" placeholder="Idade" required>

            <input type="number" id="poder" placeholder="Poder" required>

            <input type="number" id="coragem" placeholder="Coragem" required>

            <input type="number" id="inteligencia" placeholder="Inteligência" required>

            <button type="submit" id="botao">
                Cadastrar
            </button>

        </form>

        <div id="listaPrincesas"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Princesas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> Cadastro de Princesas </h1>

    <input 
        type="text" 
        id="nome" 
        placeholder="Nome da princesa"
    >

    <input 
        type="text" 
        id="poder" 
        placeholder="Poder da princesa"
    >

    <button onclick="cadastrar()">
        Cadastrar
    </button>

    <h2>Princesas cadastradas</h2>

    <div id="lista"></div>

    <script src="script.js"></script>

</body>

</html>

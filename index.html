<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Miraculous</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <header>
      <h1>🐞 Miraculous</h1>

      <p>Cadastro de Personagens</p>
    </header>

    <main class="container">

      <!-- ============================= -->
      <!-- Formulário                    -->
      <!-- ============================= -->

      <section class="formulario">

        <h2 id="tituloFormulario">Novo Personagem</h2>

        <form id="formPersonagem">

          <div class="campo">
            <label for="nome">Nome</label>

            <input
              type="text"
              id="nome"
              placeholder="Digite o nome do personagem"
              required
            />
          </div>

          <div class="campo">
            <label for="idade">Idade</label>

            <input
              type="number"
              id="idade"
              min="1"
              max="100"
              placeholder="Ex: 14"
              required
            />
          </div>

          <div class="campo">
            <label for="identidade">Identidade</label>

            <input
              type="text"
              id="identidade"
              placeholder="Ex: Marinette Dupain-Cheng"
              required
            />
          </div>

          <div class="campo">
            <label for="miraculous">Miraculous</label>

            <select id="miraculous" required>

              <option value="">Selecione</option>

              <option>Joaninha</option>

              <option>Gato</option>

              <option>Raposa</option>

              <option>Tartaruga</option>

              <option>Abelha</option>

              <option>Dragão</option>

              <option>Serpente</option>

              <option>Macaco</option>

              <option>Rato</option>

              <option>Borboleta</option>

            </select>
          </div>

          <div class="campo">
            <label for="poder">Poder</label>

            <input
              type="text"
              id="poder"
              placeholder="Ex: Lucky Charm"
              required
            />
          </div>

          <div class="campo">
            <label for="tipo">Tipo</label>

            <select id="tipo" required>

              <option value="">Selecione</option>

              <option>Herói</option>

              <option>Vilão</option>

            </select>
          </div>

          <button
            type="submit"
            id="btnCadastrar"
          >
            Cadastrar Personagem
          </button>

          <button
            type="button"
            id="btnCancelar"
            class="btn-cancelar"
            hidden
          >
            Cancelar Edição
          </button>

        </form>

      </section>


      <!-- ============================= -->
      <!-- Painel                        -->
      <!-- ============================= -->

      <section class="painel">

        <div class="topo-lista">

          <h2>Personagens Cadastrados</h2>

          <span id="contador">
            Total: 0
          </span>

        </div>

        <div
          id="listaPersonagens"
          class="lista-personagens"
        ></div>

      </section>

    </main>

    <script src="js/script.js"></script>

  </body>
          </html>
